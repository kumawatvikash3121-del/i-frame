<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile Card</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            font-family: Arial, sans-serif;
        }

        .main {
            width: 1150px;
            height: 600px;
            display: flex;
            box-shadow: 10px 12px 12px rgba(0, 0, 0, 0.6);
            border-radius: 25px;
        }

        /* LEFT SIDE */
        .left {
            width: 68%;
            background: #f5f5f5;
            position: relative;
            padding: 35px 60px;
            border-radius: 0 0 0 15px;
        }

        .left::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 30px;
            height: 100%;
            background: navy;
            border-radius: 15px;
        }

        .left h1 {
            color: navy;
            font-size: 100px;
            line-height: 1.35;
            margin-left: 0;
            font-weight: 700;
        }

        /* RIGHT SIDE */
        .card {
            width: 36%;
            height: 100%;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            position: relative;
            box-shadow: 10px 10px 12px rgba(0, 0, 0, 0.5);
        }

        .top {
            height: 160px;
            background: #08088f;
        }

        /* PROFILE IMAGE */
        .profile{
            width: 145px;
            height: 145px;
            border-radius: 50%;
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);

            object-fit: cover;

            border: 4px solid white;
        }

        .info {
            text-align: center;
            padding-top: 8px;
        }
        .info h3 {
            font-size: 33px;
            margin-bottom: 8px;
        }
        /* SOCIAL ICONS */
        .social {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            margin-top: 38px;
            padding: 0 30px;
        }

        .social a {
            font-size: 38px;
            text-decoration: none;
        }

        .instagram{
            background: linear-gradient(purple,red,yellow,orange);
            color: transparent;
            background-clip: text;
        }

        .facebook {
            color: #1877f2;
        }

        .github {
            color: #8e2de2;
        }

        .linkedin {
            color: #0a66c2;
        }

        .behance {
            color: #0000ff;
            font-weight: bold;
            font-size: 34px !important;
        }

        /* BUTTONS */
        .buttons {
            display: flex;
            justify-content: space-around;
            gap: 35px;
            padding: 0 35px;
            margin-top: 28px;
        }

        .buttons button {
            width: 50%;
            height: 48px;
            border: none;
            border-radius: 30px;
            background: navy;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .buttons button:hover {
            background: #1515c5;
        }

        /* BOTTOM STATS */
        .stats {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 25px;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .stat i {
            font-size: 38px;
            color: black;
        }

        .stat span {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="main">

        <!-- LEFT -->
        <div class="left">
            <h1>
                Profile Card<br>
                UI UX<br>
                Design
            </h1>
        </div>


        <!-- RIGHT PROFILE CARD -->
        <div class="card">

            <div class="top"></div>

            <!-- Profile Image -->
            <img class="profile"
                src="5.png"
                alt="Profile">

            <!-- Information -->
            <div class="info">
                <h3>Website Developer</h2>
                <h3>Dezyne École College</h3>
                <h3>BCA 1st Year</h4>
            </div>


            <!-- Social Media -->
            <div class="social">

                <a href="#" class="instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>

                <a href="#" class="facebook">
                    <i class="fa-brands fa-facebook"></i>
                </a>

                <a href="#" class="github">
                    <i class="fa-brands fa-github"></i>
                </a>

                <a href="#" class="linkedin">
                    <i class="fa-brands fa-linkedin"></i>
                </a>

                <a href="#" class="behance">
                    <i class="fa fa-brands fa-behance"></i>
                </a>

            </div>


            <!-- Buttons -->
            <div class="buttons">
                <button>Subscribe</button>
                <button>Message</button>
            </div>


            <!-- Stats -->
            <div class="stats">

                <div class="stat">
                    <i class="fa-solid fa-heart"></i>
                    <span>60.4k</span>
                </div>

                <div class="stat">
                    <i class="fa-solid fa-comment"></i>
                    <span>20k</span>
                </div>

                <div class="stat">
                    <i class="fa-solid fa-share"></i>
                    <span>12.6k</span>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
