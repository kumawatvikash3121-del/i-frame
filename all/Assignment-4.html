<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 1px solid black;
            display: flex;
        }
        .box{
            height: 100%;
            width: 25%;
           border: 1px solid black;

        }
        img{
            width: 100%;
        }
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

    </style>
</head>
<body>
    <h1 align="center">Dynamic Gallery </h1>
    <div class="container">
        <div class="box"><img src="1.png" alt="">
            <img src="2.png" alt="">
            <img src="3.png" alt="">
            <img src="4.png" alt="">
        </div>
        <div class="box">
            <img src="4.png" alt="">
            <img src="2.png" alt="">
            <img src="1.png" alt="">
            <img src="3.png" alt="">
        </div>
        <div class="box"><img src="1.png" alt="">
            <img src="3.png" alt="">
            <img src="2.png" alt="">
            <img src="4.png" alt="">
        </div>
        <div class="box"><img src="4.png" alt="">
            <img src="2.png" alt="">
            <img src="1.png" alt="">
            <img src="3.png" alt="">
        </div>
    </div>
</body>
</html>
